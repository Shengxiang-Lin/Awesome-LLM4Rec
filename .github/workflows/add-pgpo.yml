name: Add PGPO entry

on:
  push:
    branches:
      - add-pgpo-emnlp2026

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-pgpo-emnlp2026
      - name: Add PGPO to privacy section without changing line endings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          data = p.read_bytes()
          entry = '| [PGPO: Prototype-Guided Progressive Obfuscation for Privacy-Preserving LLM-Enhanced Recommendation](https://aclanthology.org/2026.emnlp-main.480/) | 2026 | EMNLP | 关系保真驱动的输入侧隐私保护 |'.encode('utf-8')
          anchor = '| [A federated framework for llm-based recommendation](https://aclanthology.org/2025.findings-naacl.155/) | 2025 | NAACL Findings | 联邦推荐框架     |'.encode('utf-8')
          if entry not in data:
              if anchor not in data:
                  raise SystemExit('Anchor not found')
              sep = b'\r\n' if b'\r\n' in data else b'\n'
              data = data.replace(anchor, entry + sep + anchor, 1)
              p.write_bytes(data)
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Add PGPO (EMNLP 2026)"
          git push
